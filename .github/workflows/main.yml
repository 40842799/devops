name: A workflow for my Hello World App
on: push

jobs:
  build:
    name: Hello world action
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 1. Create the network and start MongoDB container with the correct alias
      - name: Setup Docker Network and MongoDB
        run: |
          docker network create seMethods
          docker run -d --name mydb --network seMethods --network-alias mydb -p 27000:27017 mongo:latest

      # 2. Package the code into the fat JAR
      #  meaning the resulting JAR is intended to contain the application
      # and its required dependencies.
      - name: Package with Maven
        run: mvn clean package

      # 3. Build your application Docker image
      - name: Build Docker Image
        run: docker build --no-cache -t devopsimage .

      # 4. Run your application on the custom network
      - name: Run Docker Container
        run: docker run --name devopscontainer --network seMethods -d devopsimage

      # 5. Wait a brief moment and check logs to verify successful database insertion
      - name: View Container Logs
        run: |
          sleep 5
          docker logs devopscontainer
