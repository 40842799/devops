name: A workflow for my Hello World App
on:
  push:
    branches: [ "master", "develop" ]
  pull_request:
    branches: [ "master", "develop" ]

jobs:
  build:
    name: Hello world action
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # 2. Package the code into the fat JAR
      # meaning the resulting JAR is intended to contain the application
      # and its required dependencies.
      - name: Package with Maven
        run: mvn clean package

      - name: Unit Tests
        run: mvn -Dtest=com.napier.devops.AppTest test

      - name: Package and Run docker compose
        run: |
          mvn package -DskipTests
          docker compose up --abort-on-container-exit

      # 5. Wait a brief moment and check logs to verify successful database insertion
      - name: View container logs
        run: |
          sleep 5
          docker compose logs --tail=200 app db

      - name: Copy output from app container
        run: |
          CID=$(docker compose ps -a -q app)
               if [ -n "$CID" ]; then
               docker cp "${CID}:/tmp/output" ./output || echo "No /tmp/output in container"
               else
               echo "app container not found"
               exit 1
               fi

      #copy output folder to new branch called output
      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output
          publish_branch: output

