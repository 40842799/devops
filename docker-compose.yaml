version: '3.8'
services:
  # Application Dockerfile is in same folder which is .
  app:
    build: .
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_PORT: 3306
    networks:
      - seMethods

  # 2. Your MySQL Database (built from your local db folder)
  db:
    build: db/.
    command: --default-authentication-plugin=mysql_native_password
    restart: always
    ports:
      - "33060:3306"
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pexample" ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - seMethods

networks:
  seMethods:
      driver: bridge