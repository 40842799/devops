name: A workflow for my Hello World App
on: push

jobs:
  build:
    name: Hello world action
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v2
        with:
          java-version: '17'
          distribution: 'temurin'

      # Changed from 'mvn compile' to 'mvn package' to generate the fat JAR
      - name: Package with Maven
        run: mvn clean package

      # Updated to run the executable JAR containing the MongoDB dependencies
      - name: Run Java Application
        run: java -jar target/seMethods-1.0-SNAPSHOT-jar-with-dependencies.jar

      - name: Build Docker Image
        run: docker build -t devopsimage .

      - name: Run image
        run: docker run --name devopscontainer -d devopsimage

      - name: view logs
        run: docker logs devopscontainer



